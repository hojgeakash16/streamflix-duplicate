# Preparing CI/CD pipeline for Streamflix Application 

name: Streamflix CI/CD Pipeline

on:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    code: 
        name: Code Quality Checks
        runs-on: ubuntu-latest
        steps:
            - name: Clone and Checkout Repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: 'npm' # Automatically caches npm dependencies to speed up future runs
                cache-dependency-path: | 
                  ./frontend/package-lock.json
                  ./backend/package-lock.json
                
            - name: Install Frontend Dependencies
              run: npm ci --prefix frontend

            - name: Build Frontend
              run: npm run build --prefix frontend

            - name: Install Backend Dependencies
              run: npm ci --prefix backend


    build:
        name: Build the Service 
        needs: code
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Upload Workspace Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: streamflix-workspace
                path: .
                include-hidden-files: true


    test:
        name: Run Tests in Docker Environment
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download Build Workspace
              uses: actions/download-artifact@v4
              with:
                name: streamflix-workspace
                path: .

            - name: Spin up Docker Compose Environment
              run: docker compose up -d

            - name: Test the Service Health Endpoint
              run: |
                for i in {1..15}; do
                  if curl --fail http://localhost:3000/api/health; then
                    echo "Streamflix API is healthy"
                    exit 0
                  fi
                  echo "Waiting for API..."
                  sleep 5
                done

                echo "API health check failed"
                exit 1

            - name: Tear down environment
              if: always() # Ensures clean up happens even if the test step fails
              run: docker compose down -v --rmi local

    deploy:
        name: Deploy to Docker Hub
        needs: [code, build, test]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
            
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and push production image
              uses: docker/build-push-action@v6
              with:
                context: ./backend
                file: ./backend/Dockerfile # Validated root execution path
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/streamflix-api:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/streamflix-api:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

            